<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安检通道调度系统 - 数据管理</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", sans-serif; background: #f5f7fa; }
        .layout { display: flex; min-height: 100vh; }
        .sidebar { width: 220px; background: linear-gradient(180deg, #1e3c72 0%, #2a5298 100%); color: white; padding: 20px 0; }
        .sidebar-logo { text-align: center; font-size: 18px; font-weight: bold; padding: 20px 0; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
        .sidebar-menu { list-style: none; }
        .sidebar-menu li { margin-bottom: 5px; }
        .sidebar-menu li a { display: block; padding: 12px 25px; color: rgba(255,255,255,0.8); text-decoration: none; transition: all 0.3s; }
        .sidebar-menu li a:hover { background: rgba(255,255,255,0.1); color: white; }
        .sidebar-menu li.active a { background: rgba(255,255,255,0.15); color: white; border-left: 3px solid #4fc3f7; }
        .main { flex: 1; padding: 20px; }
        .header { background: #fff; padding: 15px 25px; border-radius: 6px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .header h2 { color: #333; font-size: 20px; }
        .user-info { color: #666; }
        .card { background: #fff; border-radius: 6px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .card-title { font-size: 16px; font-weight: bold; color: #333; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid #4a90d9; }
        .tabs { display: flex; margin-bottom: 20px; background: #fff; border-radius: 6px; padding: 0 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .tab { padding: 15px 25px; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.3s; color: #666; }
        .tab:hover { color: #4a90d9; }
        .tab.active { color: #4a90d9; border-bottom-color: #4a90d9; font-weight: bold; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .table { width: 100%; border-collapse: collapse; }
        .table th, .table td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        .table th { background: #f8f9fa; font-weight: bold; color: #555; }
        .table tr:hover { background: #f8f9fa; }
        .btn { padding: 6px 15px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; margin-right: 5px; transition: all 0.3s; }
        .btn-primary { background: #4a90d9; color: #fff; }
        .btn-primary:hover { background: #357abd; }
        .btn-success { background: #5cb85c; color: #fff; }
        .btn-success:hover { background: #4cae4c; }
        .btn-secondary { background: #6c757d; color: #fff; }
        .btn-secondary:hover { background: #5a6268; }
        .btn-danger { background: #d9534f; color: #fff; }
        .btn-danger:hover { background: #c9302c; }
        .btn-warning { background: #f0ad4e; color: #fff; }
        .btn-warning:hover { background: #ec971f; }
        .status-open { color: #5cb85c; font-weight: bold; }
        .status-closed { color: #d9534f; font-weight: bold; }
        .status-maintain { color: #f0ad4e; font-weight: bold; }
        input[type="text"], select, textarea { padding: 6px 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; width: 100%; }
        input[type="text"]:focus, select:focus, textarea:focus { outline: none; border-color: #4a90d9; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #555; font-weight: bold; }
        .param-row { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
        .param-key { width: 220px; font-weight: bold; color: #333; }
        /* 参数中文名为主标签，英文标识仅作小号灰色附注（程序内部使用，不面向业务人员） */
        .param-name { font-weight: bold; color: #333; }
        .param-key-code { display: block; font-weight: normal; color: #b0b0b0; font-size: 12px;
                          font-family: Consolas, Monaco, "Courier New", monospace; margin-top: 2px; }
        .param-value { flex: 1; }
        .param-desc { width: 300px; color: #999; font-size: 13px; margin-left: 20px; line-height: 1.5; }
        .param-actions { width: 160px; text-align: right; }
        .param-hint { color: #999; font-size: 12px; font-weight: normal; margin-left: 10px; }
        .empty-tip { color: #999; font-size: 13px; padding: 12px 0; }
    </style>
</head>
<body>
    <div class="layout">
        <div class="sidebar">
            <div class="sidebar-logo">安检通道调度系统</div>
            <ul class="sidebar-menu">
                <li><a href="/data-import">数据导入</a></li>
                <li class="active"><a href="/data-management">数据管理</a></li>
                <li><a href="/schedule">通道调度</a></li>
                <li><a href="/roster">人员排班</a></li>
                <li><a href="/analysis">历史分析</a></li>
                
            </ul>
        </div>
        <div class="main">
            <div class="header">
                <h2>数据管理</h2>
                <div class="user-info">欢迎，管理员</div>
            </div>

            <div class="tabs">
                <div class="tab active" onclick="switchTab('channel', this)">通道数据管理</div>
                <div class="tab" onclick="switchTab('param', this)">系统参数配置</div>
                <div class="tab" onclick="switchTab('user', this)">用户管理</div>
            </div>

            <!-- 通道数据管理 -->
            <div id="tab-channel" class="tab-content active">
                <div class="card">
                    <div class="card-title">
                        安检通道信息
                        <button type="button" class="btn btn-success" style="float: right;" onclick="addChannel()">添加通道</button>
                    </div>
                    <table class="table" id="channelTable">
                        <thead>
                            <tr>
                                <th>通道编号</th>
                                <th>通道类型</th>
                                <th>状态</th>
                                <th>描述</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- 通道数据由后端 /api/channels 动态加载 -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 系统参数配置 -->
            <div id="tab-param" class="tab-content">
                <div class="card">
                    <div class="card-title">
                        系统参数配置
                        <button type="button" class="btn btn-success" style="float: right;" onclick="addParam()">添加参数</button>
                    </div>
                    <div class="param-hint" style="margin: 0 0 8px 0;">
                        参数名以中文展示；下方浅灰字体为程序内部英文标识，业务人员无需关注。
                    </div>
                    <div id="paramList">
                        <!-- 参数由后端 /api/params 动态加载 -->
                    </div>
                </div>
            </div>

            <!-- 用户管理 -->
            <div id="tab-user" class="tab-content">
                <div class="card">
                    <div class="card-title">
                        用户管理
                        <button type="button" class="btn btn-success" style="float: right;" onclick="addUser()">添加用户</button>
                    </div>
                    <table class="table" id="userTable">
                        <thead>
                            <tr>
                                <th>用户名</th>
                                <th>角色</th>
                                <th>用户登录密码</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- 用户数据由后端 /api/users 动态加载 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 标签页切换
        function switchTab(tabName, element) {
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.getElementById('tab-' + tabName).classList.add('active');
            element.classList.add('active');
        }

        // 角色与权限映射
        const rolePermissions = {
            '系统管理员': '全部权限',
            '值班调度员': '数据导入、通道调度、历史分析',
            '排班人员': '人员排班、历史分析'
        };

        function escHtml(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
                {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]
            ));
        }
        function statusClass(st) {
            if (st === '开放') return 'status-open';
            if (st === '维护中') return 'status-maintain';
            return 'status-closed';
        }

        // ========== 通道数据管理（后端持久化） ==========
        function loadChannels() {
            const tbody = document.querySelector('#channelTable tbody');
            fetch('/api/channels')
                .then(r => r.json())
                .then(res => {
                    if (!res || !res.success) { return; }
                    tbody.innerHTML = '';
                    const list = res.data || [];
                    if (!list.length) {
                        tbody.innerHTML = '<tr><td colspan="5" class="empty-tip">暂无通道数据，点击右上角「添加通道」新增。</td></tr>';
                        return;
                    }
                    list.forEach(ch => {
                        const tr = document.createElement('tr');
                        tr.dataset.id = ch.id;
                        tr.innerHTML =
                            '<td class="col-code">' + escHtml(ch.channel_code) + '</td>' +
                            '<td class="col-type">' + escHtml(ch.channel_type) + '</td>' +
                            '<td class="col-status"><span class="' + statusClass(ch.status) + '">' + escHtml(ch.status) + '</span></td>' +
                            '<td class="col-desc">' + escHtml(ch.description) + '</td>' +
                            '<td class="col-actions">' +
                                '<button class="btn btn-secondary" onclick="editChannel(this)">编辑</button>' +
                                '<button class="btn btn-danger" onclick="deleteChannel(this)">删除</button>' +
                            '</td>';
                        tbody.appendChild(tr);
                    });
                })
                .catch(() => { tbody.innerHTML = '<tr><td colspan="5" class="empty-tip">加载通道失败</td></tr>'; });
        }

        function editChannel(btn) {
            const row = btn.closest('tr');
            row.dataset.origCode = row.querySelector('.col-code').textContent;
            row.dataset.origType = row.querySelector('.col-type').textContent;
            row.dataset.origStatus = row.querySelector('.col-status').textContent;
            row.dataset.origDesc = row.querySelector('.col-desc').textContent;

            row.querySelector('.col-code').innerHTML = '<input type="text" value="' + escHtml(row.dataset.origCode) + '" style="width:90px">';
            row.querySelector('.col-type').innerHTML = '<input type="text" value="' + escHtml(row.dataset.origType) + '" style="width:90px">';
            row.querySelector('.col-status').innerHTML = '<select><option>开放</option><option>维护中</option><option>关闭</option></select>';
            row.querySelector('.col-status select').value = row.dataset.origStatus;
            row.querySelector('.col-desc').innerHTML = '<input type="text" value="' + escHtml(row.dataset.origDesc) + '" style="width:160px">';

            row.querySelector('.col-actions').innerHTML =
                '<button class="btn btn-primary" onclick="saveChannel(this)">保存</button>' +
                '<button class="btn btn-secondary" onclick="cancelChannel(this)">取消</button>';
        }

        function saveChannel(btn) {
            const row = btn.closest('tr');
            const code = row.querySelector('.col-code input').value.trim();
            const type = row.querySelector('.col-type input').value.trim();
            const status = row.querySelector('.col-status select').value;
            const desc = row.querySelector('.col-desc input').value.trim();
            if (!code) { alert('请输入通道编号'); return; }
            const fd = new FormData();
            fd.append('id', row.dataset.id);
            fd.append('channel_code', code);
            fd.append('channel_type', type);
            fd.append('status', status);
            fd.append('description', desc);
            fetch('/api/channels/update', { method: 'POST', body: fd })
                .then(r => r.json())
                .then(res => {
                    if (res && res.success) { alert('通道已更新'); loadChannels(); }
                    else { alert(res && res.message ? res.message : '更新失败'); }
                })
                .catch(() => alert('更新失败，请重试'));
        }

        function cancelChannel(btn) {
            loadChannels();
        }

        function deleteChannel(btn) {
            const row = btn.closest('tr');
            const id = row.dataset.id;
            if (confirm('确定要删除该通道吗？')) {
                const fd = new FormData();
                fd.append('id', id);
                fetch('/api/channels/delete', { method: 'POST', body: fd })
                    .then(r => r.json())
                    .then(res => { if (res && res.success) { loadChannels(); } else { alert(res && res.message ? res.message : '删除失败'); } })
                    .catch(() => alert('删除失败，请重试'));
            }
        }

        function addChannel() {
            const tbody = document.querySelector('#channelTable tbody');
            const tr = document.createElement('tr');
            tr.dataset.id = '';
            tr.innerHTML =
                '<td class="col-code"><input type="text" placeholder="通道编号" style="width:90px"></td>' +
                '<td class="col-type"><input type="text" value="普通通道" style="width:90px"></td>' +
                '<td class="col-status"><select><option>开放</option><option>维护中</option><option>关闭</option></select></td>' +
                '<td class="col-desc"><input type="text" placeholder="描述" style="width:160px"></td>' +
                '<td class="col-actions">' +
                    '<button class="btn btn-primary" onclick="saveNewChannel(this)">保存</button>' +
                    '<button class="btn btn-secondary" onclick="loadChannels()">取消</button>' +
                '</td>';
            tbody.appendChild(tr);
        }

        function saveNewChannel(btn) {
            const row = btn.closest('tr');
            const code = row.querySelector('.col-code input').value.trim();
            const type = row.querySelector('.col-type input').value.trim();
            const status = row.querySelector('.col-status select').value;
            const desc = row.querySelector('.col-desc input').value.trim();
            if (!code) { alert('请输入通道编号'); return; }
            const fd = new FormData();
            fd.append('channel_code', code);
            fd.append('channel_type', type);
            fd.append('status', status);
            fd.append('description', desc);
            fetch('/api/channels/add', { method: 'POST', body: fd })
                .then(r => r.json())
                .then(res => { if (res && res.success) { alert('通道已添加'); loadChannels(); } else { alert(res && res.message ? res.message : '添加失败'); } })
                .catch(() => alert('添加失败，请重试'));
        }

        // ========== 系统参数配置（后端持久化） ==========
        function loadParams() {
            const box = document.getElementById('paramList');
            fetch('/api/params')
                .then(r => r.json())
                .then(res => {
                    if (!res || !res.success) { return; }
                    const list = res.data || [];
                    if (!list.length) {
                        box.innerHTML = '<div class="empty-tip">暂无系统参数，点击右上角「添加参数」新增。</div>';
                        return;
                    }
                    box.innerHTML = '';
                    list.forEach(p => {
                        const div = document.createElement('div');
                        div.className = 'param-row';
                        div.dataset.id = p.id;
                        div.dataset.key = p.param_key;
                        // 展示优先级：param_name（中文名） > param_key（兜底）
                        const showName = (p.param_name && String(p.param_name).trim()) || p.param_key;
                        div.innerHTML =
                            '<div class="param-key">' +
                                '<span class="param-name">' + escHtml(showName) + '</span>' +
                                '<span class="param-key-code">' + escHtml(p.param_key) + '</span>' +
                            '</div>' +
                            '<div class="param-value"><span class="value-text">' + escHtml(p.param_value) + '</span></div>' +
                            '<div class="param-desc">' + escHtml(p.description) + '</div>' +
                            '<div class="param-actions">' +
                                '<button class="btn btn-secondary" onclick="editParam(this)">编辑</button>' +
                                '<button class="btn btn-danger" onclick="deleteParam(this)">删除</button>' +
                            '</div>';
                        box.appendChild(div);
                    });
                })
                .catch(() => { box.innerHTML = '<div class="empty-tip">加载参数失败</div>'; });
        }

        function editParam(btn) {
            const row = btn.closest('.param-row');
            const key = row.dataset.key || '';
            const curName = row.querySelector('.param-name').textContent;
            const curVal = row.querySelector('.value-text').textContent;
            const curDesc = row.querySelector('.param-desc').textContent;
            row.dataset.origValue = curVal;
            row.dataset.origDesc = curDesc;
            // 中文名可编辑；英文标识只读展示，避免误改导致算法读不到参数
            row.querySelector('.param-key').innerHTML =
                '<input type="text" class="param-name-input" value="' + escHtml(curName) +
                '" style="width:200px" placeholder="参数中文名">' +
                '<span class="param-key-code">' + escHtml(key) + '（内部标识，不可修改）</span>';
            row.querySelector('.param-value').innerHTML = '<input type="text" value="' + escHtml(curVal) + '" style="width:120px">';
            row.querySelector('.param-desc').innerHTML = '<input type="text" value="' + escHtml(curDesc) + '" style="width:290px">';
            row.querySelector('.param-actions').innerHTML =
                '<button class="btn btn-primary" onclick="saveParam(this)">保存</button>' +
                '<button class="btn btn-secondary" onclick="cancelParam(this)">取消</button>';
        }

        function saveParam(btn) {
            const row = btn.closest('.param-row');
            const nameBox = row.querySelector('.param-name-input');
            const name = nameBox ? nameBox.value.trim() : '';
            const value = row.querySelector('.param-value input').value.trim();
            const desc = row.querySelector('.param-desc input').value.trim();
            if (!name) { alert('请输入参数中文名'); return; }
            const fd = new FormData();
            fd.append('id', row.dataset.id);
            fd.append('param_key', row.dataset.key || '');
            fd.append('param_name', name);
            fd.append('param_value', value);
            fd.append('description', desc);
            fetch('/api/params/update', { method: 'POST', body: fd })
                .then(r => r.json())
                .then(res => { if (res && res.success) { alert('参数已更新'); loadParams(); } else { alert(res && res.message ? res.message : '更新失败'); } })
                .catch(() => alert('更新失败，请重试'));
        }

        function cancelParam(btn) {
            loadParams();
        }

        function deleteParam(btn) {
            const row = btn.closest('.param-row');
            if (confirm('确定要删除该参数吗？')) {
                const fd = new FormData();
                fd.append('id', row.dataset.id);
                fetch('/api/params/delete', { method: 'POST', body: fd })
                    .then(r => r.json())
                    .then(res => { if (res && res.success) { loadParams(); } else { alert(res && res.message ? res.message : '删除失败'); } })
                    .catch(() => alert('删除失败，请重试'));
            }
        }

        function addParam() {
            const box = document.getElementById('paramList');
            const div = document.createElement('div');
            div.className = 'param-row';
            div.dataset.id = '';
            div.innerHTML =
                '<div class="param-key"><input type="text" class="param-name-input" placeholder="参数中文名" style="width:200px"></div>' +
                '<div class="param-value">' +
                    '<input type="text" class="param-key-input" placeholder="参数值" style="width:110px">' +
                    '<input type="text" class="param-value-input" placeholder="内部标识（英文，如 avg_security_speed）" style="width:250px; margin-left:10px;">' +
                '</div>' +
                '<div class="param-desc"><input type="text" placeholder="说明" style="width:290px"></div>' +
                '<div class="param-actions">' +
                    '<button class="btn btn-primary" onclick="saveNewParam(this)">保存</button>' +
                    '<button class="btn btn-secondary" onclick="loadParams()">取消</button>' +
                '</div>';
            box.appendChild(div);
        }

        function saveNewParam(btn) {
            const row = btn.closest('.param-row');
            const name = row.querySelector('.param-name-input').value.trim();
            const key = row.querySelector('.param-value-input').value.trim();
            const value = row.querySelector('.param-key-input').value.trim();
            const desc = row.querySelector('.param-desc input').value.trim();
            if (!name) { alert('请输入参数中文名'); return; }
            if (!key) { alert('请输入参数内部标识（英文键），供程序读取使用'); return; }
            const fd = new FormData();
            fd.append('param_key', key);
            fd.append('param_name', name);
            fd.append('param_value', value);
            fd.append('description', desc);
            fetch('/api/params/add', { method: 'POST', body: fd })
                .then(r => r.json())
                .then(res => { if (res && res.success) { alert('参数已添加'); loadParams(); } else { alert(res && res.message ? res.message : '添加失败'); } })
                .catch(() => alert('添加失败，请重试'));
        }

        // ========== 用户管理（后端持久化） ==========
        let CURRENT_IS_ADMIN = false;

        function loadUsers() {
            const tbody = document.querySelector('#userTable tbody');
            fetch('/api/users')
                .then(r => r.json())
                .then(res => {
                    if (!res || !res.success) { return; }
                    CURRENT_IS_ADMIN = !!res.is_admin;
                    tbody.innerHTML = '';
                    (res.data || []).forEach(u => {
                        const tr = document.createElement('tr');
                        tr.dataset.id = u.id;
                        tr.dataset.role = u.role;
                        tr.dataset.pwd = u.password_masked || '******';
                        const actions = u.can_edit
                            ? '<button class="btn btn-secondary" onclick="editUser(this)">编辑</button>' +
                              (CURRENT_IS_ADMIN ? '<button class="btn btn-danger" onclick="deleteUser(this)">删除</button>' : '')
                            : '<span style="color:#999">无权限</span>';
                        tr.innerHTML =
                            '<td class="col-username">' + escHtml(u.username) + '</td>' +
                            '<td class="col-role">' + escHtml(u.role) + '</td>' +
                            '<td class="col-password">' + escHtml(u.password_masked) + '</td>' +
                            '<td class="col-actions">' + actions + '</td>';
                        tbody.appendChild(tr);
                    });
                })
                .catch(() => {});
        }

        function editUser(btn) {
            const row = btn.closest('tr');
            const id = row.dataset.id;
            row.dataset.origRole = row.querySelector('.col-role').textContent;
            row.querySelector('.col-username').innerHTML =
                '<span>' + escHtml(row.querySelector('.col-username').textContent) + '</span>';
            row.querySelector('.col-role').innerHTML =
                '<select' + (CURRENT_IS_ADMIN ? '' : ' disabled') + '>' +
                '<option>系统管理员</option><option>调度人员</option></select>';
            row.querySelector('.col-role select').value = row.dataset.origRole;

            // 密码列：点编辑后向后端取明文，仅管理员或本人可取到
            const pwdCell = row.querySelector('.col-password');
            pwdCell.innerHTML = '<input type="text" class="pwd-input" value="" style="width:120px">';
            const fd = new FormData();
            fd.append('id', id);
            fetch('/api/users/password', { method: 'POST', body: fd })
                .then(r => r.json())
                .then(res => {
                    if (res && res.success) {
                        pwdCell.querySelector('.pwd-input').value = res.password;
                    } else {
                        pwdCell.innerHTML = '<span style="color:#c00">' +
                            escHtml(res && res.message ? res.message : '无法查看') + '</span>';
                    }
                })
                .catch(() => {});

            row.querySelector('.col-actions').innerHTML =
                '<button class="btn btn-primary" onclick="saveUser(this)">保存</button>' +
                '<button class="btn btn-secondary" onclick="cancelUser(this)">取消</button>';
        }

        function saveUser(btn) {
            const row = btn.closest('tr');
            const pwdInput = row.querySelector('.col-password .pwd-input');
            const pwd = pwdInput ? pwdInput.value : '';
            const roleSel = row.querySelector('.col-role select');
            const role = roleSel ? roleSel.value : row.dataset.origRole;
            if (pwd !== '' && pwd.length < 6) { alert('密码至少 6 位'); return; }
            const fd = new FormData();
            fd.append('id', row.dataset.id || '');
            fd.append('role', role);
            if (pwd) { fd.append('password', pwd); }
            fetch('/api/users/update', { method: 'POST', body: fd })
                .then(r => r.json())
                .then(res => {
                    if (res && res.success) { alert('用户信息已保存'); }
                    else { alert(res && res.message ? res.message : '保存失败'); }
                    loadUsers();
                })
                .catch(() => { alert('保存失败，请重试'); loadUsers(); });
        }

        function cancelUser(btn) { loadUsers(); }

        function deleteUser(btn) {
            const row = btn.closest('tr');
            const id = row.dataset.id;
            if (!id) { row.remove(); return; }
            if (confirm('确定要删除该用户吗？')) {
                const fd = new FormData();
                fd.append('id', id);
                fetch('/api/users/delete', { method: 'POST', body: fd })
                    .then(r => r.json())
                    .then(res => {
                        if (res && res.success) { row.remove(); }
                        else { alert(res && res.message ? res.message : '删除失败'); }
                    })
                    .catch(() => alert('删除失败，请重试'));
            }
        }

        function addUser() {
            const tbody = document.querySelector('#userTable tbody');
            const tr = document.createElement('tr');
            tr.dataset.id = '';
            tr.dataset.origRole = '调度人员';
            tr.innerHTML =
                '<td class="col-username"><input type="text" placeholder="用户名" style="width:100px"></td>' +
                '<td class="col-role"><select><option>调度人员</option><option>系统管理员</option></select></td>' +
                '<td class="col-password"><input type="text" placeholder="初始密码" value="123456" style="width:120px"></td>' +
                '<td class="col-actions">' +
                    '<button class="btn btn-primary" onclick="saveNewUser(this)">保存</button>' +
                    '<button class="btn btn-secondary" onclick="loadUsers()">取消</button>' +
                '</td>';
            tbody.appendChild(tr);
        }

        function saveNewUser(btn) {
            const row = btn.closest('tr');
            const username = row.querySelector('.col-username input').value;
            const role = row.querySelector('.col-role select').value;
            const pwd = row.querySelector('.col-password input').value || '123456';
            if (!username) { alert('请输入用户名'); return; }
            const fd = new FormData();
            fd.append('username', username);
            fd.append('role', role);
            fd.append('password', pwd);
            fetch('/api/users/add', { method: 'POST', body: fd })
                .then(r => r.json())
                .then(res => {
                    if (res && res.success) { alert('新用户已添加'); loadUsers(); }
                    else { alert(res && res.message ? res.message : '添加失败'); }
                })
                .catch(() => alert('添加失败，请重试'));
        }

        // 页面加载即拉取三类数据，确保与数据库一致
        loadChannels();
        loadParams();
        loadUsers();
    </script>
</body>
</html>
