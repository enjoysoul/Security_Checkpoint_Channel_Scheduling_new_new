<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安检通道调度系统 - 历史分析</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background-color: #f5f7fa;
            color: #333;
        }
        .main-container {
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 220px;
            background: linear-gradient(180deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 20px 0;
        }
        .sidebar-logo {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
        }
        .nav-menu {
            list-style: none;
        }
        .nav-item {
            margin-bottom: 5px;
        }
        .nav-link {
            display: block;
            padding: 12px 25px;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            transition: all 0.3s;
        }
        .nav-link:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
        .nav-link.active {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border-left: 3px solid #4fc3f7;
        }
        .main-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        .header-bar {
            background: white;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-title {
            font-size: 20px;
            color: #1e3c72;
            font-weight: bold;
        }
        .user-info {
            color: #666;
            font-size: 14px;
        }
        .logout-btn {
            color: #ff4757;
            text-decoration: none;
            margin-left: 15px;
        }
        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            padding: 20px;
            margin-bottom: 20px;
        }
        .card-title {
            font-size: 16px;
            color: #333;
            font-weight: bold;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }
        .form-group {
            flex: 1;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-size: 14px;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: #2a5298;
            color: white;
        }
        .btn-secondary {
            background: #f5f5f5;
            color: #666;
            border: 1px solid #ddd;
        }
        .btn-info {
            background: #4fc3f7;
            color: white;
        }
        .table {
            width: 100%;
            border-collapse: collapse;
        }
        .table th,
        .table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }
        .table th {
            background: #f8f9fa;
            color: #333;
            font-weight: bold;
        }
        .table tr:hover {
            background: #f8f9fa;
        }
        .status-success {
            color: #2ed573;
            font-weight: bold;
        }
        .status-failed {
            color: #ff4757;
            font-weight: bold;
        }
        .status-partial {
            color: #ffa502;
            font-weight: bold;
        }
        .pagination {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            gap: 10px;
        }
        .pagination button {
            padding: 6px 12px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 4px;
            cursor: pointer;
        }
        .pagination button.active {
            background: #2a5298;
            color: white;
            border-color: #2a5298;
        }
        .stats-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .stat-card {
            flex: 1;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            padding: 20px;
            text-align: center;
        }
        .stat-number {
            font-size: 28px;
            font-weight: bold;
            color: #2a5298;
            margin-bottom: 5px;
        }
        .stat-label {
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- 左侧导航栏 -->
        <div class="sidebar">
            <div class="sidebar-logo">安检通道调度系统</div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="/data-import" class="nav-link">数据导入</a>
                </li>
                <li class="nav-item">
                    <a href="/data-management" class="nav-link">数据管理</a>
                </li>
                <li class="nav-item">
                    <a href="/schedule" class="nav-link">通道调度</a>
                </li>
                <li class="nav-item">
                    <a href="/roster" class="nav-link">人员排班</a>
                </li>
                <li class="nav-item">
                    <a href="/analysis" class="nav-link active">历史分析</a>
                </li>
                
            </ul>
        </div>

        <!-- 主内容区 -->
        <div class="main-content">
            <!-- 顶部标题栏 -->
            <div class="header-bar">
                <div class="page-title">历史分析</div>
                <div class="user-info">
                    <a href="/logout" class="logout-btn">退出登录</a>
                </div>
            </div>

            <!-- 统计概览 -->
            <div class="stats-row">
                <div class="stat-card">
                    <div class="stat-number" id="totalCount">0</div>
                    <div class="stat-label">总模拟次数</div>
                </div>
            </div>

            <!-- 查询条件 -->
            <div class="card">
                <div class="card-title">查询条件</div>
                <form onsubmit="return queryHistory()">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="startDate">开始日期</label>
                            <input type="date" id="startDate" name="startDate">
                        </div>
                        <div class="form-group">
                            <label for="endDate">结束日期</label>
                            <input type="date" id="endDate" name="endDate">
                        </div>
                        <div class="form-group">
                            <label for="airport">机场</label>
                            <select id="airport" name="airport">
                                <option value="">全部机场</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>&nbsp;</label>
                            <button type="submit" class="btn btn-primary">查询</button>
                        </div>
                    </div>
                </form>
            </div>

            <!-- 历史记录列表 -->
            <div class="card">
                <div class="card-title">
                    历史模拟记录
                    <button type="button" class="btn btn-secondary" style="float: right;" onclick="exportHistory()">导出数据</button>
                </div>
                <table class="table">
                    <thead>
                        <tr>
                            <th>序号</th>
                            <th>模拟时间</th>
                            <th>机场</th>
                            <th>预测日期</th>
                            <th>日客流量</th>
                            <th>高峰时段</th>
                            <th>通道分配 / 平均等待</th>
                            <th>人员排班</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="historyBody">
                        <tr>
                            <td colspan="9" style="text-align:center;color:#999;">点击查询按钮加载历史记录</td>
                        </tr>
                    </tbody>
                </table>
                <div class="pagination" id="pagination"></div>
            </div>
        </div>
    </div>
    <script>
        let currentPage = 1;
        let totalPages = 1;

        // 页面加载时初始化机场下拉框
        window.onload = function() {
            loadAirports();
            queryHistory();
        };

        function loadAirports() {
            // 从数据库加载所有机场
            fetch('/api/airports')
                .then(response => response.json())
                .then(data => {
                    const select = document.getElementById('airport');
                    if (data.airports) {
                        data.airports.forEach(airport => {
                            const option = document.createElement('option');
                            option.value = airport;
                            option.textContent = airport;
                            select.appendChild(option);
                        });
                    }
                })
                .catch(() => {
                    // 如果API不可用，使用默认机场
                    const defaultAirports = ['义乌机场', '杭州萧山机场', '上海浦东机场', '北京首都机场', '广州白云机场', '深圳宝安机场'];
                    const select = document.getElementById('airport');
                    defaultAirports.forEach(airport => {
                        const option = document.createElement('option');
                        option.value = airport;
                        option.textContent = airport;
                        select.appendChild(option);
                    });
                });
        }

        function queryHistory() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const airport = document.getElementById('airport').value;

            const formData = new FormData();
            formData.append('startDate', startDate);
            formData.append('endDate', endDate);
            formData.append('airport', airport);
            formData.append('page', currentPage);

            fetch('/query-history', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(result => {
                if (result.success) {
                    renderHistory(result.data.records);
                    document.getElementById('totalCount').textContent = result.data.total;
                    totalPages = result.data.total_pages;
                    renderPagination();
                } else {
                    alert('查询失败：' + result.message);
                }
            })
            .catch(error => {
                alert('查询出错：' + error);
            });
            return false;
        }

        function fmtSchedule(r) {
            if (!r.has_schedule) { return '<span style="color:#999">未生成</span>'; }
            const ch = (r.schedule_channels == null) ? '-' : r.schedule_channels;
            const w = (r.avg_wait == null) ? '-' : Number(r.avg_wait).toFixed(1);
            const t = r.wait_threshold;
            let tag = '';
            if (t != null && r.avg_wait != null) {
                tag = (Number(r.avg_wait) > Number(t))
                    ? ' <span style="color:#c00;font-weight:600">超阈值</span>'
                    : ' <span style="color:#0a0">正常</span>';
            }
            return ch + ' 条 / ' + w + ' min' + tag;
        }

        function renderHistory(records) {
            const tbody = document.getElementById('historyBody');
            if (records.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;color:#999;">暂无记录</td></tr>';
                return;
            }

            let html = '';
            records.forEach((record, index) => {
                const seq = (currentPage - 1) * 10 + index + 1;
                html += `
                    <tr>
                        <td>${seq}</td>
                        <td>${record.sim_time}</td>
                        <td>${record.airport}</td>
                        <td>${record.predict_date}</td>
                        <td>${record.daily_passengers || '-'}</td>
                        <td>${record.peak_hour || '-'}</td>
                        <td>${fmtSchedule(record)}</td>
                        <td>${record.has_roster ? '已生成' : '未生成'}</td>
                        <td><a href="/analysis/detail/${record.sim_id}" class="btn btn-info">查看详情</a></td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        function renderPagination() {
            const pagination = document.getElementById('pagination');
            let html = '';
            
            html += `<button onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>上一页</button>`;
            
            for (let i = 1; i <= totalPages; i++) {
                if (i === currentPage) {
                    html += `<button class="active">${i}</button>`;
                } else if (i === 1 || i === totalPages || Math.abs(i - currentPage) <= 2) {
                    html += `<button onclick="goToPage(${i})">${i}</button>`;
                } else if (Math.abs(i - currentPage) === 3) {
                    html += `<button disabled>...</button>`;
                }
            }
            
            html += `<button onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>下一页</button>`;
            pagination.innerHTML = html;
        }

        function goToPage(page) {
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            queryHistory();
        }

        function exportHistory() {
            window.location.href = '/export-history';
        }
    </script>
</body>
</html>
